plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.noragold.calculator'
    compileSdk 35

    signingConfigs {
        stableDebug {
            storeFile rootProject.file('nora-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'ir.noragold.calculator'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
    }
}
