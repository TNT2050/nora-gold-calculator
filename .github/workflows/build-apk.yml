name: Build Nora Gold APK
# Trigger fresh build for Nora Gold v1.5 invoice discount update

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare launcher icon and validate app JavaScript
        run: |
          mkdir -p app/src/main/res/mipmap-nodpi
          base64 --decode app/src/main/assets/launcher_icon.b64 > app/src/main/res/mipmap-nodpi/ic_launcher.jpg
          base64 --decode app/src/main/assets/nora-logo.b64 > app/src/main/assets/nora-logo.jpg
          python3 - <<'PY'
          import re
          html = open('app/src/main/assets/index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, 'No application JavaScript found'
          open('/tmp/nora-gold.js', 'w', encoding='utf-8').write('\n'.join(scripts))
          PY
          node --check /tmp/nora-gold.js
          test -s app/src/main/res/mipmap-nodpi/ic_launcher.jpg
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoraGold-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
