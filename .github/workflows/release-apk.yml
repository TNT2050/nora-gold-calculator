name: Publish Nora Gold APK Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare launcher icon and validate application JavaScript
        run: |
          mkdir -p app/src/main/res/mipmap-nodpi
          base64 --decode app/src/main/assets/launcher_icon.b64 > app/src/main/res/mipmap-nodpi/ic_launcher.jpg
          python3 - <<'PY'
          import re
          html = open('app/src/main/assets/index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, 'No application JavaScript found'
          open('/tmp/nora-gold.js', 'w', encoding='utf-8').write('\\n'.join(scripts))
          PY
          node --check /tmp/nora-gold.js
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish release and APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
