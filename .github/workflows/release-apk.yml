name: Publish Nora Gold APK Release

on:
  push:
    branches: [ main ]
    paths:
      - 'app/build.gradle'
      - 'app/src/main/assets/index.html'
      - 'app/src/main/java/ir/noragold/calculator/MainActivity.java'
      - 'app/src/main/AndroidManifest.xml'
      - 'nora-debug.keystore'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oE "versionName '[^']+'" app/build.gradle | cut -d "'" -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Skip if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Java
        if: steps.exists.outputs.exists != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        if: steps.exists.outputs.exists != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare icon, logo and validate JavaScript
        if: steps.exists.outputs.exists != 'true'
        run: |
          mkdir -p app/src/main/res/mipmap-nodpi
          base64 --decode app/src/main/assets/launcher_icon.b64 > app/src/main/res/mipmap-nodpi/ic_launcher.jpg
          base64 --decode app/src/main/assets/nora-logo.b64 > app/src/main/assets/nora-logo.jpg
          python3 - <<'PY'
          import re
          html = open('app/src/main/assets/index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, 'No application JavaScript found'
          open('/tmp/nora-gold.js', 'w', encoding='utf-8').write('\\n'.join(scripts))
          PY
          node --check /tmp/nora-gold.js
      - name: Build APK with stable app signing
        if: steps.exists.outputs.exists != 'true'
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK release
        if: steps.exists.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Nora Gold v${{ steps.version.outputs.version }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
